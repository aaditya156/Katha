services:
  db:
    image: pgvector/pgvector:pg16
    container_name: katha_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-katha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-katha_prod_secret}
      POSTGRES_DB: ${POSTGRES_DB:-katha_studio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-katha} -d ${POSTGRES_DB:-katha_studio}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: katha_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: katha_backend_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-katha}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-katha_studio}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-prod_secret_key_change_in_production_1234567890}
      ENVIRONMENT: production
      DEBUG: "false"
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      TTS_DEFAULT_PROVIDER: ${TTS_DEFAULT_PROVIDER:-elevenlabs}
      STORY_BIBLE_RETRIEVAL_ENABLED: ${STORY_BIBLE_RETRIEVAL_ENABLED:-true}
    volumes:
      - audio_cache_data:/app/audio_cache
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: katha_frontend_prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/" ]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
  redisdata:
  audio_cache_data:
