name: CI Evaluation & Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test_and_eval_gate:
    name: Backend Test & Quality Gate
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test
      SECRET_KEY: test_secret_key_for_ci_eval_gate_only
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      EVAL_GATE_MIN_PASS_RATE: "0.85"
      EVAL_GATE_MIN_COMPOSITE: "3.50"
      EVAL_GATE_MAX_COST_USD: "0.0500"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || pip install poetry && cd backend && poetry export -f requirements.txt --output requirements.txt --without-hashes && pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          PYTHONPATH=backend pytest backend/tests -v

      - name: Run CI Evaluation Quality & Cost Gate
        run: |
          PYTHONPATH=backend python backend/scripts/eval_gate.py --samples 10

  frontend_lint_and_build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Check and Vite Production Build
        run: |
          cd frontend
          npm run build

