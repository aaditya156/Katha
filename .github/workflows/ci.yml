name: Katha Studio CI / CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_tests:
    name: Backend Pytest & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: katha
          POSTGRES_PASSWORD: katha_secret
          POSTGRES_DB: katha_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci_secret_key_testing_environment_only_1234567890
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      REDIS_URL: redis://localhost:6379/0
      LLM_DEFAULT_PROVIDER: mock
      TTS_DEFAULT_PROVIDER: mock
      STORY_BIBLE_RETRIEVAL_ENABLED: "true"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg & Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Full Pytest Suite (49+ Tests)
        run: |
          PYTHONPATH=backend pytest backend/tests -v --durations=10

      - name: Run Production CI Evaluation Gate
        run: |
          PYTHONPATH=backend python backend/scripts/eval_gate.py --samples 10

  frontend_checks:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Strict TypeCheck & Vite Production Build
        run: |
          cd frontend
          npm run build

  docker_build_check:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configurations
        run: |
          docker compose config
          docker compose -f docker-compose.prod.yml config

      - name: Build Backend Docker Image
        run: |
          docker build -t katha-backend:test ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t katha-frontend:test ./frontend

