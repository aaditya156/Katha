services:
  db:
    image: pgvector/pgvector:pg16
    container_name: katha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-katha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-katha_secret}
      POSTGRES_DB: ${POSTGRES_DB:-katha_studio}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-katha} -d ${POSTGRES_DB:-katha_studio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: katha_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: katha_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://katha:katha_secret@db:5432/katha_studio
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production_1234567890}
      ENVIRONMENT: development
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      TTS_DEFAULT_PROVIDER: ${TTS_DEFAULT_PROVIDER:-mock}
      STORY_BIBLE_RETRIEVAL_ENABLED: ${STORY_BIBLE_RETRIEVAL_ENABLED:-true}
    volumes:
      - ./audio_cache:/app/audio_cache

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: katha_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  redisdata:

