[project]
name = "katha-studio-backend"
version = "0.1.0"
description = "Backend for Katha Studio - Agentic Multilingual Audio-Story Generation Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "greenlet>=3.1.1",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pyjwt[crypto]>=2.9.0",
    "bcrypt>=4.0.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
